apply plugin: 'com.android.application'

android {
    namespace 'com.ast.breathlessamiga'
    // AGP 7.3.1 keeps this project compatible with Android Studio 2022 and
    // Java 11. Its bundled AAPT2 cannot read the newer android-35 resource
    // table, so resources compile against API 34 while the AAOS flavor still
    // declares the Play-required targetSdk 35.
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.ast.breathlessamiga'
        versionCode 37
        versionName '1.0-dual-platform'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11 -Wall -Wextra -Wno-unused-parameter'
            }
        }

    }

    flavorDimensions 'platform'
    productFlavors {
        ouya {
            dimension 'platform'
            minSdkVersion 16
            targetSdkVersion 28
            versionNameSuffix '-ouya'
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        automotive {
            dimension 'platform'
            minSdkVersion 28
            targetSdkVersion 35
            versionNameSuffix '-automotive'
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}
