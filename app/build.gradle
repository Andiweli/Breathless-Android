apply plugin: 'com.android.application'

android {
    namespace 'com.ast.breathlessamiga'
    // Google Play requires Android 16 / API 36 for this bundle. AGP 8.9.1 is
    // the minimum officially supported Android Gradle Plugin for API 36.0.
    compileSdkVersion 36
    // NDK r23c is the final NDK release supporting Android 4.1 / API 16.
    // Newer NDKs reject the OUYA flavor's native build.
    ndkVersion '23.2.8568313'

    defaultConfig {
        applicationId 'com.ast.breathlessamiga'
        versionCode 42
        versionName '1.2'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11 -Wall -Wextra -Wno-unused-parameter'
            }
        }

    }

    // AGP 8 disables BuildConfig generation unless explicitly requested.
    // MainActivity uses BuildConfig.DEBUG to keep diagnostic logging out of
    // release builds.
    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'platform'
    productFlavors {
        ouya {
            dimension 'platform'
            minSdkVersion 16
            targetSdkVersion 36
            ndk {
                // One normal/OUYA APK also covers ARM64 and native x86_64
                // Chromebooks without relying on ChromeOS ARM translation.
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
        automotive {
            dimension 'platform'
            minSdkVersion 28
            targetSdkVersion 36
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    // RetroTouch is intentionally isolated as one replaceable binary. Compatible updates only
    // require replacing app/libs/retrotouch.aar and rebuilding the game.
    implementation files('libs/retrotouch.aar')
}
